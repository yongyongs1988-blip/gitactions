name: Deploy mood project
on:
  push:
    branches: [ main ]
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Public server and redeploy backend on Private server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.PUBLIC_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            PRIVATE_KEY="$HOME/gitactions/myapp.pem"
            test -f "$PRIVATE_KEY"
            chmod 600 "$PRIVATE_KEY"
            ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -i "$PRIVATE_KEY" \
              "${{ secrets.SSH_USER }}@${{ secrets.BACKEND_HOST }}" <<'REMOTE'
            set -e
            cd ~/gitactions
            git pull --ff-only
            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.local.yml down
              docker compose -f docker-compose.local.yml up -d --build backend
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose -f docker-compose.local.yml down
              docker-compose -f docker-compose.local.yml up -d --build backend
            else
              echo "Docker Compose is not installed on the private server." >&2
              exit 127
            fi
            REMOTE
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Public server and redeploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.PUBLIC_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd ~/gitactions
            git pull --ff-only
            docker rm -f mood-frontend 2>/dev/null || true
            docker build --no-cache \
              -t mood-frontend:latest \
              ./frontend
            docker run -d \
              --name mood-frontend \
              -p 80:80 \
              -p 443:443 \
              -e DOMAIN='${{ secrets.DOMAIN }}' \
              -e BACKEND_HOST='${{ secrets.BACKEND_HOST }}' \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              mood-frontend:latest
            docker ps --filter name=mood-frontend
            docker logs --tail 50 mood-frontend
